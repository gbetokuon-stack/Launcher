<!DOCTYPE html>
<html lang="vi" class="scroll-smooth dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AcousticForge Titanium — Trình Khởi Chạy Minecraft Thế Hệ Mới</title>
  <meta name="description" content="AcousticForge Titanium - Trình khởi chạy Minecraft hiệu năng cao, tích hợp Modrinth, CurseForge, Iris Shaders và cấu hình JVM tự động.">
  <link rel="icon" type="image/png" href="icon.png">

  <!-- Full Vietnamese Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,700;1,900&family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            cyber: {
              black: '#030608',
              obsidian: '#070c0f',
              card: '#0c141a',
              cardHover: '#111d26',
              border: 'rgba(16, 185, 129, 0.18)',
              borderGlow: 'rgba(52, 211, 153, 0.5)',
              emerald: '#10b981',
              neon: '#00ff88',
              cyan: '#06b6d4',
              gold: '#f59e0b',
              purple: '#a855f7'
            }
          },
          fontFamily: {
            display: ['"Chakra Petch"', '"Be Vietnam Pro"', 'sans-serif'],
            sans: ['"Be Vietnam Pro"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #030608; }
    ::-webkit-scrollbar-thumb { background: #112824; border-radius: 4px; border: 1px solid rgba(16,185,129,0.3); }
    ::-webkit-scrollbar-thumb:hover { background: #10b981; }

    .cyber-grid {
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(16, 185, 129, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(16, 185, 129, 0.04) 1px, transparent 1px);
    }
    .hero-radial {
      background: radial-gradient(circle at 50% 20%, rgba(16, 185, 129, 0.18) 0%, rgba(6, 182, 212, 0.06) 45%, transparent 75%);
    }
    .glass-panel {
      background: rgba(12, 20, 26, 0.78);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(16, 185, 129, 0.18);
    }
    .glass-card-hover {
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glass-card-hover:hover {
      border-color: rgba(52, 211, 153, 0.5);
      box-shadow: 0 0 30px rgba(16, 185, 129, 0.2), inset 0 0 20px rgba(16, 185, 129, 0.05);
      transform: translateY(-3px);
    }
    .text-glow {
      text-shadow: 0 0 25px rgba(16, 185, 129, 0.6), 0 0 50px rgba(16, 185, 129, 0.25);
    }
    .tab-btn.active {
      background: rgba(16, 185, 129, 0.2);
      border-color: #10b981;
      color: #34d399;
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.25);
    }
  </style>
</head>
<body class="bg-cyber-black text-slate-100 font-sans antialiased overflow-x-hidden selection:bg-emerald-500 selection:text-black">

  <canvas id="matrix-canvas" class="fixed inset-0 pointer-events-none z-0 opacity-45"></canvas>
  <div class="fixed inset-0 cyber-grid pointer-events-none z-0"></div>
  <div class="fixed inset-0 hero-radial pointer-events-none z-0"></div>

  <!-- Notification Toast -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-28 opacity-0 transition-all duration-300 flex items-center gap-3 px-5 py-3.5 rounded-xl bg-cyber-card border border-emerald-500/50 shadow-2xl text-sm font-medium">
    <i data-lucide="check-circle" class="w-5 h-5 text-emerald-400"></i>
    <span id="toast-text" class="text-slate-100">Đã hoàn thành!</span>
  </div>
